<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibrasNaval - Batalha Naval</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <div class="painel-lateral">
        <div class="painel-titulo">Status da partida</div>
        <div class="painel-tempo">
            <span class="painel-legenda">Tempo</span>
            <strong id="div-tempo">00:00:00</strong>
        </div>
        <div class="painel-secao">
            <span class="painel-legenda">Jogada atual</span>
            <div class="painel-jogada">
                <span id="div-coluna">Coluna: -</span>
                <span id="div-linha">Linha: -</span>
            </div>
        </div>
        <div class="painel-secao painel-navios">
            <span class="painel-legenda">Frota</span>
            <strong id="div-navios-restantes">Navios restantes: 0</strong>
            <span id="div-navios-total">Total de navios: 0</span>
        </div>
    </div>
    
    <div class="container-principal">
        <div class="conteudo-superior">
            <h1 class="titulo">LibrasNaval</h1>
            <p>Jogo desenvolvido pela turma de TADS 2024 - IFPA Campus Paragominas</p>
            <p>Faixa etária: <b><span id="faixa-etaria-jogador">...</span></b></p>
        </div>
        
        <div class="container-tabuleiro">
            <div class="quadro_b">
                <table class="tabuleiro">
                    <thead>
                        <tr>
                            <th></th>
                            <th>A</th>
                            <th>E</th>
                            <th>I</th>
                            <th>O</th>
                            <th>U</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th>1</th>
                            <td id="cell-1-A"></td>
                            <td id="cell-1-E"></td>
                            <td id="cell-1-I"></td>
                            <td id="cell-1-O"></td>
                            <td id="cell-1-U"></td>
                        </tr>

                        <tr>
                            <th>2</th>
                            <td id="cell-2-A"></td>
                            <td id="cell-2-E"></td>
                            <td id="cell-2-I"></td>
                            <td id="cell-2-O"></td>
                            <td id="cell-2-U"></td>
                        </tr>

                        <tr>
                            <th>3</th>
                            <td id="cell-3-A"></td>
                            <td id="cell-3-E"></td>
                            <td id="cell-3-I"></td>
                            <td id="cell-3-O"></td>
                            <td id="cell-3-U"></td>
                        </tr>

                        <tr>
                            <th>4</th>
                            <td id="cell-4-A"></td>
                            <td id="cell-4-E"></td>
                            <td id="cell-4-I"></td>
                            <td id="cell-4-O"></td>
                            <td id="cell-4-U"></td>
                        </tr>

                        <tr>
                            <th>5</th>
                            <td id="cell-5-A"></td>
                            <td id="cell-5-E"></td>
                            <td id="cell-5-I"></td>
                            <td id="cell-5-O"></td>
                            <td id="cell-5-U"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
