<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libras Naval - Batalha Naval</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <div class="painel-lateral">
        <div id="div-tempo">...</div>
        <div id="div-coluna"></div>
        <div id="div-linha"></div>
        <div id="div-navios"></div>
    </div>
    
    <div class="container-principal">
        <div class="conteudo-superior">
            <h1 class="titulo">Libras Naval</h1>

            <p>Jogando como <b><span id="apelido-jogador">...</span></b></p>
        </div>
        
        <div class="container-tabuleiro">
            <div class="quadro_b">
                <table class="tabuleiro">
                    <thead>
                        <tr>
                            <th></th>
                            <th>A</th>
                            <th>E</th>
                            <th>I</th>
                            <th>O</th>
                            <th>U</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <th>1</th>
                            <td id="cell-1-A"></td>
                            <td id="cell-1-E"></td>
                            <td id="cell-1-I"></td>
                            <td id="cell-1-O"></td>
                            <td id="cell-1-U"></td>
                        </tr>

                        <tr>
                            <th>2</th>
                            <td id="cell-2-A"></td>
                            <td id="cell-2-E"></td>
                            <td id="cell-2-I"></td>
                            <td id="cell-2-O"></td>
                            <td id="cell-2-U"></td>
                        </tr>

                        <tr>
                            <th>3</th>
                            <td id="cell-3-A"></td>
                            <td id="cell-3-E"></td>

                            <td id="cell-3-U"></td>
                        </tr>

                        <tr>
                            <th>4</th>
                            <td id="cell-4-A"></td>
                            <td id="cell-4-E"></td>
                            <td id="cell-4-I"></td>
                            <td id="cell-4-O"></td>
                            <td id="cell-4-U"></td>
                        </tr>

                        <tr>
                            <th>5</th>
                            <td id="cell-5-A"></td>
                            <td id="cell-5-E"></td>
                            <td id="cell-5-I"></td>
                            <td id="cell-5-O"></td>
                            <td id="cell-5-U"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
